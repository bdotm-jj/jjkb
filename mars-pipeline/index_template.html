<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARS Dev Team — Weekly Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Cantata+One&family=Nunito:wght@400;500;600;700&family=Cousine:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2EDE2; --bg-raised:#FBF7EC; --bg-sunken:#E7E1D2;
    --ink:#0F1B2D; --ink-2:#2A3A52; --ink-3:#5C6A80; --ink-4:#97A0B2;
    --rule:#0F1B2D; --rule-soft:rgba(15,27,45,0.14);
    --accent:#2E6DA4; --accent-2:#4A8BC2; --accent-soft:#A9C4DD;
    --hot:#C24B1E; --ok:#3D6B3D; --amber:#B5860D;
    --serif: "Cantata One", "Times New Roman", Times, serif;
    --grotesk: "Nunito", "Neue Haas Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "Cousine", "Courier New", ui-monospace, Menlo, monospace;
    --radius:2px; --radius-lg:4px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--grotesk);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
  .subtitle{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-size:12px;}
  h1{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:clamp(34px,5vw,52px);line-height:1.03;margin:10px 0 6px;letter-spacing:-0.01em;}
  .byline{font-size:14px;color:var(--ink-3);margin-bottom:6px;}
  .byline b{color:var(--ink-2);font-weight:600;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:24px 0 6px;}
  .stat-card{background:var(--bg-raised);border:1px solid var(--rule-soft);border-radius:var(--radius);padding:16px 18px;text-align:center;}
  .stat-card .num{font-family:var(--serif);font-size:34px;font-weight:400;color:var(--accent);line-height:1;}
  .stat-card .lbl{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:8px;text-transform:uppercase;letter-spacing:.08em;}
  .stat-card .wow{font-family:var(--mono);font-size:10.5px;margin-top:6px;letter-spacing:.03em;}
  .wow.up{color:var(--ok);} .wow.down{color:var(--hot);} .wow.flat{color:var(--ink-4);}
  .month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .month-card{display:block;text-decoration:none;background:var(--bg-raised);border:1px solid var(--rule-soft);border-left:3px solid var(--accent-2);border-radius:var(--radius);padding:16px 18px;transition:border-color .12s;}
  .month-card:hover{border-color:var(--accent);}
  .month-card .mlabel{font-family:var(--serif);font-size:22px;color:var(--ink);line-height:1;}
  .month-card .mkind{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin-top:8px;}
  .month-card .msub{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.45;}
  .ov-section-title{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-size:11px;font-weight:500;margin:34px 0 12px;border-bottom:1px solid var(--rule-soft);padding-bottom:6px;}
  .tbl-scroll{overflow-x:auto;border:1px solid var(--rule-soft);border-radius:var(--radius);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    background:var(--bg-sunken);color:var(--ink-3);font-family:var(--mono);font-weight:500;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule);
    cursor:pointer;white-space:nowrap;user-select:none;
  }
  thead th:hover{color:var(--accent);}
  thead th .arr{opacity:.45;margin-left:4px;font-size:9px;}
  thead th.sorted{color:var(--ink);}
  thead th.sorted .arr{opacity:1;color:var(--accent);}
  thead th.num,tbody td.num{text-align:right;font-variant-numeric:tabular-nums;}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--rule-soft);color:var(--ink-2);vertical-align:middle;}
  tbody tr:nth-child(even){background:var(--bg-raised);}
  tbody tr:hover{background:var(--accent-soft);cursor:pointer;}
  td.wk a{font-family:var(--serif);font-size:16px;color:var(--ink);text-decoration:none;font-weight:400;}
  td.wk a:hover{color:var(--accent);text-decoration:underline;}
  td.wk .iso{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.05em;margin-top:2px;}
  .bar{display:inline-block;height:7px;border-radius:20px;background:var(--accent);vertical-align:middle;margin-left:8px;}
  .flag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;padding:2px 7px;border-radius:20px;text-transform:uppercase;margin-right:4px;}
  .flag.red{background:rgba(194,75,30,.15);color:var(--hot);}
  .flag.amber{background:rgba(181,134,13,.16);color:var(--amber);}
  .flag.ok{background:rgba(61,107,61,.15);color:var(--ok);}
  .footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule-soft);font-family:var(--mono);font-size:11px;color:var(--ink-4);letter-spacing:.05em;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .hint{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:10px 0 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="subtitle">MARS Dev Team · Dev Time &amp; Ticket Reporting</div>
  <h1>MARS Reports</h1>
  <div class="byline" id="byline"></div>

  <div class="ov-section-title" id="monthly-title" style="display:none">Monthly roll-ups</div>
  <div class="month-grid" id="months"></div>

  <div class="ov-section-title">Latest week</div>
  <div class="stat-grid" id="kpis"></div>

  <div class="ov-section-title">All weeks</div>
  <div class="tbl-scroll">
    <table id="tbl">
      <thead><tr>
        <th data-k="week" data-t="s" class="sorted">Week <span class="arr">▼</span></th>
        <th data-k="people" data-t="n" class="num">People <span class="arr"></span></th>
        <th data-k="teamHours" data-t="n" class="num">Team hrs <span class="arr"></span></th>
        <th data-k="util" data-t="n" class="num">Utilization <span class="arr"></span></th>
        <th data-k="tickets" data-t="n" class="num">Tickets <span class="arr"></span></th>
        <th data-k="weeklyCloses" data-t="n" class="num">Dev closes <span class="arr"></span></th>
        <th data-k="flagtot" data-t="n" class="num">Flags <span class="arr"></span></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p class="hint">Click any column header to sort · click a row to open that week's full report</p>

  <div class="footer">
    <span>MARS Dev Team · Weekly report index</span>
    <span id="genstamp"></span>
  </div>
</div>

<script>
const TRENDS = __TRENDS__;
const MONTHS = __MONTHS__;
const fmt = (n,d=0)=>Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const closesCell = v => (v==null ? '—' : fmt(v));
const pct = u => (u*100).toFixed(1)+'%';

// ---- monthly roll-ups ----
if(MONTHS && MONTHS.length){
  document.getElementById('monthly-title').style.display='';
  document.getElementById('months').innerHTML = MONTHS.map(m=>
    '<a class="month-card" href="'+m.file+'"><div class="mlabel">'+m.label+'</div>'+
    '<div class="mkind">Month-to-date</div>'+
    (m.sub?'<div class="msub">'+m.sub+'</div>':'')+'</a>'
  ).join('');
}
function flagTotal(w){ const f=w.flags||{}; return (f.lowHoursRed||0)+(f.lowVolRed||0)+(f.bounceHigh||0); }
function href(w){ return 'mars-weekly-'+w.week+'.html'; }

// ---- byline ----
const latest = TRENDS[TRENDS.length-1] || null;
document.getElementById('byline').innerHTML =
  '<b>'+TRENDS.length+'</b> week'+(TRENDS.length===1?'':'s')+' of history' +
  (latest ? ' · latest <b>'+latest.label+'</b>' : '');
document.getElementById('genstamp').textContent = TRENDS.length+' weeks on file';

// ---- KPI strip (latest week + WoW) ----
function wowChip(cur,prev,invert){
  if(prev==null||prev===0){ return '<div class="wow flat">—</div>'; }
  const d=cur-prev, pctd=(d/prev)*100;
  let good = invert ? d<0 : d>0;
  const cls = Math.abs(pctd)<0.05 ? 'flat' : (good?'up':'down');
  const arr = d>0?'▲':(d<0?'▼':'•');
  return '<div class="wow '+cls+'">'+arr+' '+(d>0?'+':'')+fmt(pctd,1)+'% WoW</div>';
}
if(latest){
  const prev = TRENDS.length>=2 ? TRENDS[TRENDS.length-2] : null;
  const cards = [
    {lbl:'People',      v:fmt(latest.people),        cur:latest.people,       prev:prev&&prev.people},
    {lbl:'Team hours',  v:fmt(latest.teamHours),     cur:latest.teamHours,    prev:prev&&prev.teamHours},
    {lbl:'Utilization', v:pct(latest.util),          cur:latest.util,         prev:prev&&prev.util},
    {lbl:'Tickets',     v:fmt(latest.tickets),       cur:latest.tickets,      prev:prev&&prev.tickets},
    {lbl:'Dev closes',  v:closesCell(latest.weeklyCloses),  cur:latest.weeklyCloses, prev:prev&&prev.weeklyCloses, na:latest.weeklyCloses==null},
  ];
  document.getElementById('kpis').innerHTML = cards.map(c=>
    '<div class="stat-card"><div class="num">'+c.v+'</div><div class="lbl">'+c.lbl+'</div>'+
    (prev && !c.na ? wowChip(c.cur, c.prev, false) : '')+'</div>'
  ).join('');
}

// ---- sortable table ----
const tbody=document.getElementById('tbody');
const maxHours = Math.max.apply(null, TRENDS.map(w=>w.teamHours||0));
function flagCell(w){
  const f=w.flags||{}; const parts=[];
  if(f.lowHoursRed) parts.push('<span class="flag red">'+f.lowHoursRed+' hrs</span>');
  if(f.lowVolRed)   parts.push('<span class="flag amber">'+f.lowVolRed+' vol</span>');
  if(f.bounceHigh)  parts.push('<span class="flag amber">'+f.bounceHigh+' bnc</span>');
  return parts.length? parts.join('') : '<span class="flag ok">clean</span>';
}
function render(rows){
  tbody.innerHTML = rows.map(w=>{
    const barW = maxHours? Math.round((w.teamHours/maxHours)*46) : 0;
    return '<tr onclick="location.href=\''+href(w)+'\'">'+
      '<td class="wk"><a href="'+href(w)+'">'+w.label+'</a><span class="iso">'+w.week+'</span></td>'+
      '<td class="num">'+fmt(w.people)+'</td>'+
      '<td class="num">'+fmt(w.teamHours)+'<span class="bar" style="width:'+barW+'px"></span></td>'+
      '<td class="num">'+pct(w.util)+'</td>'+
      '<td class="num">'+fmt(w.tickets)+'</td>'+
      '<td class="num">'+closesCell(w.weeklyCloses)+'</td>'+
      '<td class="num">'+flagCell(w)+'</td>'+
    '</tr>';
  }).join('');
}
let sortK='week', sortDir=-1; // newest first
function val(w,k){ return k==='flagtot'? flagTotal(w) : w[k]; }
function sortNow(){
  const rows=TRENDS.slice().sort((a,b)=>{
    let x=val(a,sortK), y=val(b,sortK);
    if(sortK==='week'){ return (x<y?-1:x>y?1:0)*sortDir; }
    return ((+x)-(+y))*sortDir;
  });
  render(rows);
  document.querySelectorAll('#tbl thead th').forEach(th=>{
    const k=th.dataset.k, a=th.querySelector('.arr');
    if(k===sortK){ th.classList.add('sorted'); a.textContent = sortDir<0?'▼':'▲'; }
    else { th.classList.remove('sorted'); a.textContent=''; }
  });
}
document.querySelectorAll('#tbl thead th').forEach(th=>{
  th.addEventListener('click',()=>{
    const k=th.dataset.k;
    if(k===sortK){ sortDir*=-1; } else { sortK=k; sortDir = (k==='week')? -1 : -1; }
    sortNow();
  });
});
sortNow();
</script>
</body>
</html>
