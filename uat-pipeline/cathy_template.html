<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cathy Parmley UAT Testing Report — __MONTH__ __YEAR__</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cantata+One&family=Nunito:wght@400;500;600;700&family=Cousine:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2EDE2; --bg-raised:#FBF7EC; --bg-sunken:#E7E1D2;
    --ink:#0F1B2D; --ink-2:#2A3A52; --ink-3:#5C6A80; --ink-4:#97A0B2;
    --rule:#0F1B2D; --rule-soft:rgba(15,27,45,0.14);
    --accent:#2E6DA4; --accent-2:#4A8BC2; --hot:#C24B1E; --ok:#3D6B3D; --amber:#B5860D;
    --serif:"Cantata One","Times New Roman",Times,serif;
    --grotesk:"Nunito","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"Cousine","Courier New",ui-monospace,monospace;
    --radius:2px; --radius-lg:4px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--grotesk);background:var(--bg);color:#222;-webkit-font-smoothing:antialiased;}
  .deck{max-width:1100px;margin:0 auto;padding:20px;}
  .slide{display:none;background:var(--bg);border:1px solid var(--rule-soft);border-radius:var(--radius-lg);padding:46px 54px;min-height:600px;position:relative;}
  .slide.active{display:block;}
  h1{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:44px;margin:0 0 6px;line-height:1.05;letter-spacing:-.01em;}
  h2{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:32px;margin:0 0 20px;border-bottom:1px solid var(--rule);padding-bottom:10px;}
  .subtitle{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-size:13px;margin-bottom:26px;}
  .sub{color:var(--ink-3);font-size:13px;margin:6px 0 0;}
  .backlink{display:inline-flex;gap:6px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-decoration:none;position:absolute;top:18px;right:24px;}
  .backlink:hover{color:var(--accent);}
  .cover-wrap{display:flex;flex-direction:column;justify-content:center;min-height:500px;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px;}
  .stat-card{background:var(--bg-raised);border:1px solid var(--rule-soft);border-radius:var(--radius);padding:20px;text-align:center;}
  .stat-card .num{font-family:var(--serif);font-size:34px;font-weight:400;color:var(--accent);line-height:1;}
  .stat-card .lbl{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:8px;text-transform:uppercase;letter-spacing:.08em;}
  .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
  .metric-card{background:var(--bg-raised);border:1px solid var(--rule-soft);border-radius:var(--radius);padding:18px;text-align:center;}
  .metric-card .num{font-family:var(--serif);font-size:28px;font-weight:400;color:var(--accent);line-height:1.05;}
  .metric-card .lbl{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:6px;text-transform:uppercase;letter-spacing:.06em;}
  .callouts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0;}
  .callout{background:var(--bg-raised);border:1px solid var(--rule-soft);border-radius:var(--radius);padding:14px 16px;font-size:13.5px;line-height:1.5;color:var(--ink-2);}
  .callout.finding{border-left:3px solid var(--accent);}
  .callout.outlier{border-left:3px solid var(--hot);}
  .callout.watch{border-left:3px solid var(--amber);}
  .callout b{display:block;margin-bottom:4px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--ink-3);font-weight:500;}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px;}
  th,td{padding:9px 12px;border-bottom:1px solid var(--rule-soft);text-align:left;color:var(--ink-2);}
  th{color:var(--ink-3);font-family:var(--mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--rule);}
  td{font-variant-numeric:tabular-nums;}
  td.num,th.num{text-align:right;}
  tr:nth-child(even) td{background:var(--bg-sunken);}
  .baseline-box{background:var(--bg-raised);border:1px solid var(--rule-soft);border-radius:var(--radius);padding:16px 20px;margin-top:14px;}
  .baseline-box h3{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;margin:0 0 6px;color:var(--ink-3);font-size:12px;font-weight:500;}
  .delta{font-family:var(--mono);font-size:12px;font-weight:600;}
  .delta.up{color:var(--hot);} .delta.down{color:var(--ok);} .delta.flat{color:var(--ink-4);}
  .chart-wrap{position:relative;height:380px;margin-top:10px;}
  ul.findings{font-size:15px;line-height:1.65;padding-left:22px;color:var(--ink-2);margin:6px 0;}
  ul.findings li{margin-bottom:9px;}
  ul.findings b{color:var(--ink);}
  .rec-box{background:var(--bg-raised);border:1px solid var(--rule-soft);border-left:3px solid var(--ok);border-radius:var(--radius);padding:16px 20px;margin-top:18px;}
  .rec-box h3{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;margin:0 0 6px;color:var(--ink-3);font-size:12px;font-weight:500;}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;background:var(--bg-raised);border:1px solid var(--rule-soft);border-radius:var(--radius-lg);padding:10px 16px;}
  .nav button{background:transparent;color:var(--ink);border:1px solid var(--rule-soft);padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-family:var(--mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;}
  .nav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .nav button:disabled{color:var(--ink-4);cursor:not-allowed;}
  .dots{display:flex;gap:8px;} .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-4);cursor:pointer;} .dot.active{background:var(--accent);}
  .page-lbl{font-family:var(--mono);color:var(--ink-3);font-size:12px;}
  .foot-note{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);margin-top:20px;letter-spacing:.04em;}
</style>
</head>
<body>
<div class="deck">
  <!-- SLIDE 1 -->
  <div class="slide active" id="slide1">
    <div class="cover-wrap">
      <div class="subtitle">Monthly Operations UAT Testing Summary</div>
      <h1 id="c-title"></h1>
      <div class="subtitle" id="c-period" style="margin-top:8px;"></div>
      <div class="stat-grid" id="c-stats"></div>
      <div class="foot-note" id="c-foot"></div>
    </div>
  </div>
  <!-- SLIDE 2 -->
  <div class="slide" id="slide2">
    <h2>Key Metrics</h2>
    <div class="metric-grid" id="m-grid"></div>
    <div class="callouts" id="m-callouts"></div>
    <div class="baseline-box">
      <h3 id="b-title"></h3>
      <table id="b-table"></table>
    </div>
  </div>
  <!-- SLIDE 3 -->
  <div class="slide" id="slide3">
    <h2>Testing Duration Over Time</h2>
    <div class="sub" id="s3-sub"></div>
    <div class="chart-wrap"><canvas id="chart3"></canvas></div>
  </div>
  <!-- SLIDE 4 -->
  <div class="slide" id="slide4">
    <h2>R1 vs R2 vs R3 Comparison</h2>
    <div class="sub">Average round duration (current period) and the per-project round breakdown.</div>
    <div class="chart-wrap" style="height:230px;"><canvas id="chart4"></canvas></div>
    <table id="t4"><thead><tr><th>Project</th><th class="num">R1</th><th class="num">R2</th><th class="num">R3</th><th class="num">Total</th></tr></thead><tbody></tbody></table>
  </div>
  <!-- SLIDE 5 -->
  <div class="slide" id="slide5">
    <h2>Key Findings &amp; Recommendations</h2>
    <ul class="findings" id="f-list"></ul>
    <div class="rec-box"><h3>Recommendations</h3><ul class="findings" id="r-list" style="margin-bottom:0;"></ul></div>
  </div>
  <div class="nav">
    <button id="prevBtn" onclick="go(-1)">&larr; Prev</button>
    <div class="dots" id="dots"></div>
    <span class="page-lbl" id="pageLbl"></span>
    <button id="nextBtn" onclick="go(1)">Next &rarr;</button>
  </div>
</div>
<script>
const DATA = __DATA__;
const d1=n=>Number(n).toFixed(1);
// cover
document.getElementById('c-title').textContent='Cathy Parmley UAT Testing Report — '+DATA.month+' '+DATA.year;
document.getElementById('c-period').textContent='Current reporting period: '+DATA.rangeLabel;
document.getElementById('c-foot').textContent=DATA.foot;
document.getElementById('c-stats').innerHTML=[
  [DATA.cover.projects,'Projects Tested'],[DATA.cover.tasks,'Testing Rounds'],
  [d1(DATA.metrics.avgTotal)+'d','Avg Total Days / Project'],[DATA.cover.rangeShort,'Date Range (2026)']
].map(c=>`<div class="stat-card"><div class="num">${c[0]}</div><div class="lbl">${c[1]}</div></div>`).join('');
// metrics
document.getElementById('m-grid').innerHTML=[
  [d1(DATA.metrics.avgTotal)+'d','Avg Project Total'],[d1(DATA.metrics.avgR1)+'d','Avg R1 Duration'],
  [d1(DATA.metrics.avgR2)+'d','Avg R2 Duration'],[DATA.metrics.longestTotal+'d','Longest — '+DATA.metrics.longestName]
].map(c=>`<div class="metric-card"><div class="num">${c[0]}</div><div class="lbl">${c[1]}</div></div>`).join('');
document.getElementById('m-callouts').innerHTML=['finding','outlier','watch'].map(k=>
  `<div class="callout ${k}"><b>${k==='finding'?'Finding':k==='outlier'?'Outlier':'Watch Item'}</b>${DATA.callouts[k]}</div>`).join('');
// baseline table
document.getElementById('b-title').textContent=DATA.baselineLabel;
document.getElementById('b-table').innerHTML='<tr><th>Metric</th><th class="num">Baseline</th><th class="num">Current</th><th class="num">Δ vs Baseline</th></tr>'+
  DATA.baselineTable.map(r=>`<tr><td>${r.metric}</td><td class="num">${r.base}</td><td class="num">${r.cur}</td><td class="num delta ${r.dir}">${r.delta}</td></tr>`).join('');
// slide3
document.getElementById('s3-sub').textContent='Total testing days per project, ordered by start date (dashed line = average '+d1(DATA.metrics.avgTotal)+'d).';
// slide4 table
document.querySelector('#t4 tbody').innerHTML=DATA.table.map(p=>
  `<tr><td>${p.name}</td><td class="num">${p.r1??'—'}</td><td class="num">${p.r2??'—'}</td><td class="num">${p.r3??'—'}</td><td class="num"><b>${p.total}</b></td></tr>`).join('');
// findings/recs
document.getElementById('f-list').innerHTML=DATA.findings.map(f=>`<li>${f}</li>`).join('');
document.getElementById('r-list').innerHTML=DATA.recs.map(r=>`<li>${r}</li>`).join('');
// deck nav
const total=5; let cur=1; const dotsEl=document.getElementById('dots');
for(let i=1;i<=total;i++){const d=document.createElement('div');d.className='dot'+(i===1?' active':'');d.onclick=()=>show(i);dotsEl.appendChild(d);}
function show(n){cur=n;for(let i=1;i<=total;i++){document.getElementById('slide'+i).classList.toggle('active',i===n);dotsEl.children[i-1].classList.toggle('active',i===n);}
  document.getElementById('prevBtn').disabled=n===1;document.getElementById('nextBtn').disabled=n===total;document.getElementById('pageLbl').textContent=n+' / '+total;
  if(n===3)draw3(); if(n===4)draw4();}
function go(x){show(Math.min(total,Math.max(1,cur+x)));}
const AX={ticks:{color:'#5C6A80'},grid:{color:'rgba(15,27,45,.10)'}};
let c3,c4;
function draw3(){ if(c3)return; c3=new Chart(document.getElementById('chart3'),{type:'line',
  data:{labels:DATA.chart3.labels,datasets:[
    {label:'Total Testing Days',data:DATA.chart3.totals,borderColor:'#2E6DA4',backgroundColor:'rgba(46,109,164,0.10)',tension:0.25,pointRadius:5,pointBackgroundColor:'#2E6DA4',fill:true},
    {label:'Average ('+d1(DATA.metrics.avgTotal)+'d)',data:DATA.chart3.labels.map(()=>DATA.metrics.avgTotal),borderColor:'#97A0B2',borderDash:[6,4],pointRadius:0,fill:false}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{color:'#5C6A80',font:{size:11}}}},
    scales:{x:{ticks:{color:'#5C6A80',maxRotation:45,minRotation:30,font:{size:10}},grid:{display:false}},y:{beginAtZero:true,title:{display:true,text:'Days',color:'#5C6A80'},...AX}}}}); }
function draw4(){ if(c4)return; c4=new Chart(document.getElementById('chart4'),{type:'bar',
  data:{labels:['R1','R2','R3'],datasets:[{label:'Avg Duration (days)',data:[DATA.chart4.r1,DATA.chart4.r2,DATA.chart4.r3],backgroundColor:['#2E6DA4','#3D6B3D','#B5860D']}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{...AX,grid:{display:false}},y:{beginAtZero:true,title:{display:true,text:'Days',color:'#5C6A80'},...AX}}}}); }
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
show(1);
</script>
</body>
</html>
